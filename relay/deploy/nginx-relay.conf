# Nginx 示例。server_name 换成你的域名。部署后对应服务器上的 /etc/nginx/conf.d/grokbot-relay.conf

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名;

    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8787/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 大文件上传/下载（Agent POST /files/upload，手机 GET /files/:id）
    location /files/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 512m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 200 'Grok Bot Relay OK\n';
        add_header Content-Type text/plain;
    }
}

# DNS 生效后在本机 SSH 执行 HTTPS（可选，当前默认 ws 无需证书）：
# certbot --nginx -d 你的域名
